<!-- GoHighLevel-safe DK header: paste this into a Custom HTML/JS element or page/header custom code. -->
<style>
.dk-ghl-header {
  --ink: #1A1A1A;
  --ink-soft: #2A2A2A;
  --white: #FFFFFF;
  --red: #CC0000;
  --red-dark: #A30000;
  --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --max-w: 1280px;
  --edge: clamp(20px, 5vw, 56px);
  --s2: 8px;
  --s5: 24px;
  --s6: 32px;
  --rule-hair: 1px solid rgba(0,0,0,0.10);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);

  position: relative;

  /* Reduced reserved space only */
  min-height: 30px;

  color: var(--ink);
  background: var(--white);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.dk-ghl-header *,
.dk-ghl-header *::before,
.dk-ghl-header *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.dk-ghl-header a {
  text-decoration: none;
  color: inherit;
}

.dk-ghl-header img {
  display: block;
  max-width: 100%;
}

.dk-ghl-header button {
  background: none;
  border: none;
  cursor: pointer;
  font: inherit;
  color: inherit;
}

.dk-ghl-header .dk-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: rgba(255,255,255,0.94);
  backdrop-filter: saturate(140%) blur(12px);
  -webkit-backdrop-filter: saturate(140%) blur(12px);
  border-bottom: var(--rule-hair);
  transition:
    box-shadow 240ms var(--ease),
    background 240ms var(--ease);
}

.dk-ghl-header .dk-nav.is-scrolled {
  box-shadow: 0 1px 0 rgba(0,0,0,0.06);
}

.dk-ghl-header .dk-nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 96px;
  max-width: var(--max-w);
  margin: 0 auto;
  padding-left: var(--edge);
  padding-right: var(--edge);
  transition: height 240ms var(--ease);
}

.dk-ghl-header .dk-nav.is-scrolled .dk-nav-inner {
  height: 72px;
}

.dk-ghl-header .dk-logo {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-family: var(--font-sans);
  text-decoration: none;
}

.dk-ghl-header .dk-logo-img {
  display: block;
  width: auto;
  height: 70px;
  max-height: 70px;
  object-fit: contain;
  transform-origin: left center;
  transition:
    height 240ms var(--ease),
    max-height 240ms var(--ease),
    transform 240ms var(--ease);
}

.dk-ghl-header .dk-nav.is-scrolled .dk-logo-img {
  height: 50px;
  max-height: 50px;
}

.dk-ghl-header .dk-nav-links {
  display: flex;
  align-items: center;
  gap: var(--s6);
}

.dk-ghl-header .dk-nav-links a {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  transition: color 180ms var(--ease);
  position: relative;
  padding: 6px 0;
}

.dk-ghl-header .dk-nav-links a:hover,
.dk-ghl-header .dk-nav-links a.active {
  color: var(--ink);
}

.dk-ghl-header .dk-nav-links a::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -2px;
  height: 1px;
  background: var(--ink);
  transform: scaleX(0);
  transform-origin: left;
  transition:
    transform 240ms var(--ease),
    background 180ms var(--ease),
    height 180ms var(--ease),
    bottom 180ms var(--ease);
}

.dk-ghl-header .dk-nav-links a:hover::after {
  transform: scaleX(1);
}

.dk-ghl-header .dk-nav-links a.active::after {
  transform: scaleX(1);
  background: var(--red);
  height: 2px;
  bottom: -3px;
}

.dk-ghl-header .dk-nav-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  min-height: 44px;
  padding: 15px 24px;
  background: var(--red);
  color: var(--white) !important;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-radius: 2px;
  border: 0;
  box-shadow: none;
  white-space: nowrap;
  transition:
    background 180ms var(--ease),
    color 180ms var(--ease),
    border-color 180ms var(--ease);
}

.dk-ghl-header .dk-nav-cta:hover {
  background: var(--red-dark);
  color: var(--white) !important;
}

.dk-ghl-header .dk-nav-cta::after {
  content: '→';
  display: inline-block;
  font-size: 13px;
  line-height: 1;
  letter-spacing: 0;
  transform: translateX(0);
  transition: transform 200ms var(--ease);
}

.dk-ghl-header .dk-nav-cta:hover::after {
  transform: translateX(3px);
}

.dk-ghl-header .dk-menu-toggle {
  display: none;
  width: 32px;
  height: 32px;
  position: relative;
}

.dk-ghl-header .dk-menu-toggle span {
  position: absolute;
  left: 4px;
  right: 4px;
  height: 1.5px;
  background: var(--ink);
  transition:
    transform 240ms var(--ease),
    opacity 180ms var(--ease);
}

.dk-ghl-header .dk-menu-toggle span:nth-child(1) {
  top: 11px;
}

.dk-ghl-header .dk-menu-toggle span:nth-child(2) {
  top: 20px;
}

.dk-ghl-header .dk-menu-toggle.is-open span:nth-child(1) {
  transform: translateY(4.5px) rotate(45deg);
}

.dk-ghl-header .dk-menu-toggle.is-open span:nth-child(2) {
  transform: translateY(-4.5px) rotate(-45deg);
}

@media (max-width: 1100px) {
  .dk-ghl-header .dk-nav-links {
    gap: var(--s5);
  }
}

/* ============================================================
   MOBILE STYLES
   ============================================================ */
@media (max-width: 900px) {
  .dk-ghl-header {
    min-height: 78px;
  }

  .dk-ghl-header .dk-nav {
    background: var(--white) !important;

    -webkit-backdrop-filter: none !important;

  .dk-ghl-header .dk-nav.is-scrolled .dk-logo-img,

    max-height: 36px !important;
  }

  .dk-ghl-header .dk-nav-links,

    display: none !important;
  }

  .dk-ghl-header .dk-menu-toggle {
    display: flex !important;
    align-items: center;
    justify-content: center;
    width: 44px !important;

    border: 2px solid var(--ink) !important;

    background: var(--white) !important;
    position: relative;
    z-index: 3002 !important;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  .dk-ghl-header .dk-menu-toggle span {
    position: absolute;
    left: 9px !important;
    right: 9px !important;
    height: 2px !important;
    background: var(--ink) !important;
    transition:
      transform 240ms var(--ease),
      opacity 180ms var(--ease);
  }

  .dk-ghl-header .dk-menu-toggle span:nth-child(1) {
    top: 11px !important;
  }

  .dk-ghl-header .dk-menu-toggle span:nth-child(2) {
    top: 21px !important;
  }

  .dk-ghl-header .dk-menu-toggle.is-open span:nth-child(1) {
    transform: translateY(5px) rotate(45deg) !important;
  }

  .dk-ghl-header .dk-menu-toggle.is-open span:nth-child(2) {
    transform: translateY(-5px) rotate(-45deg) !important;
  }
}

.dk-mobile-menu a.active {

.dk-mobile-menu a.primary {

  background: var(--red) !important;

}

.dk-mobile-menu a.primary::after {
  content: '→';

  transition: transform 200ms var(--ease);
}

.dk-mobile-menu a.primary:hover,
.dk-mobile-menu a.primary:focus-visible {
  background: var(--red-dark) !important;
  color: var(--white) !important;
}

.dk-mobile-menu a.primary:hover::after,
.dk-mobile-menu a.primary:focus-visible::after {
  transform: translateX(3px);
}

@media (min-width: 901px) {
  .dk-mobile-menu {
    display: none !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  .dk-ghl-header *,
  .dk-ghl-header *::before,
  .dk-ghl-header *::after {
    animation-duration: 0ms !important;
    animation-delay: 0ms !important;
    transition-duration: 0ms !important;
    transition-delay: 0ms !important;
  }
}

<script>
(function() {
  'use strict';

  function initDkGhlHeader(root) {
    if (
      !root ||
      root.getAttribute('data-dk-ghl-init') === 'true'
    ) {
      return;
    }

    root.setAttribute('data-dk-ghl-init', 'true');

    var nav = root.querySelector('[data-dk-ghl-nav]');
    var toggle = root.querySelector('[data-dk-ghl-menu-toggle]');
    var mobile = root.querySelector('[data-dk-ghl-mobile-menu]');
    var body = document.body;

    if (mobile && mobile.parentNode !== document.body) {
      document.body.appendChild(mobile);
    }

    function lockScroll() {
      if (
        !body ||
        body.getAttribute('data-dk-ghl-scroll-lock') === 'true'
      ) {
        return;
      }

      body.setAttribute('data-dk-ghl-scroll-lock', 'true');

      body.setAttribute(
        'data-dk-ghl-prev-overflow',
        body.style.overflow || ''
      );

      body.style.overflow = 'hidden';
    }

    function unlockScroll() {
      if (
        !body ||
        body.getAttribute('data-dk-ghl-scroll-lock') !== 'true'
      ) {
        return;
      }

      body.style.overflow =
        body.getAttribute('data-dk-ghl-prev-overflow') || '';

      body.removeAttribute('data-dk-ghl-scroll-lock');
      body.removeAttribute('data-dk-ghl-prev-overflow');
    }

    function setMenu(open) {
      if (!toggle || !mobile) {
        return;
      }

      if (open && nav) {
        var headerRect = nav.getBoundingClientRect();
        var menuTop = headerRect.bottom;

        if (menuTop < 0) {
          menuTop = 78;
        }

        mobile.style.setProperty(
          'top',
          menuTop + 'px',
          'important'
        );

        mobile.style.setProperty(
          'height',
          'calc(100vh - ' + menuTop + 'px)',
          'important'
        );

        mobile.style.setProperty(
          'min-height',
          'calc(100vh - ' + menuTop + 'px)',
          'important'
        );
      }

      toggle.classList.toggle('is-open', open);
      mobile.classList.toggle('is-open', open);

      toggle.setAttribute(
        'aria-expanded',
        open ? 'true' : 'false'
      );

      if (open) {
        lockScroll();
      } else {
        unlockScroll();
      }
    }

    function setActiveNav() {
      var currentPage =
        root.getAttribute('data-page') || '';

      var links =
        root.querySelectorAll('.dk-nav [data-nav]');

      var mobileLinks = mobile
        ? mobile.querySelectorAll('[data-nav]')
        : [];

      var allLinks = [];

      Array.prototype.push.apply(allLinks, links);
      Array.prototype.push.apply(allLinks, mobileLinks);

      Array.prototype.forEach.call(
        allLinks,
        function(link) {
          var isActive =
            currentPage &&
            link.getAttribute('data-nav') === currentPage;

          link.classList.toggle(
            'active',
            Boolean(isActive)
          );

          if (isActive) {
            link.setAttribute('aria-current', 'page');
          } else {
            link.removeAttribute('aria-current');
          }
        }
      );
    }

    if (nav) {
      var onScroll = function() {
        nav.classList.toggle(
          'is-scrolled',
          window.scrollY > 8
        );
      };

      window.addEventListener(
        'scroll',
        onScroll,
        { passive: true }
      );

      onScroll();
    }

    if (toggle && mobile) {
      var lastPointerToggle = 0;

      function toggleMenuFromInput(event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        setMenu(
          !mobile.classList.contains('is-open')
        );
      }

      if (window.PointerEvent) {
        toggle.addEventListener(
          'pointerup',
          function(event) {
            lastPointerToggle = Date.now();
            toggleMenuFromInput(event);
          }
        );
      }

      toggle.addEventListener(
        'touchend',
        function(event) {
          if (window.PointerEvent) {
            return;
          }

          lastPointerToggle = Date.now();
          toggleMenuFromInput(event);
        },
        { passive: false }
      );

      toggle.addEventListener(
        'click',
        function(event) {
          if (
            Date.now() - lastPointerToggle < 450
          ) {
            event.preventDefault();
            return;
          }

          toggleMenuFromInput(event);
        }
      );

      Array.prototype.forEach.call(
        mobile.querySelectorAll('a'),
        function(link) {
          link.addEventListener(
            'click',
            function() {
              setMenu(false);
            }
          );
        }
      );

      document.addEventListener(
        'keydown',
        function(event) {
          if (event.key === 'Escape') {
            setMenu(false);
          }
        }
      );

      window.addEventListener(
        'resize',
        function() {
          if (
            window.matchMedia &&
            window
              .matchMedia('(min-width: 901px)')
              .matches
          ) {
            setMenu(false);
          }
        }
      );
    }

    setActiveNav();
  }

  function initAllDkGhlHeaders() {
    var headers = document.querySelectorAll(
      '[data-dk-ghl-header]'
    );

    Array.prototype.forEach.call(
      headers,
      initDkGhlHeader
    );
  }

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      initAllDkGhlHeaders
    );
  } else {
    initAllDkGhlHeaders();
  }

  window.addEventListener(
    'load',
    initAllDkGhlHeaders
  );
})();
</script>
