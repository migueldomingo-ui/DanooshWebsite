<!-- GoHighLevel-safe DK dynamic footer: safe to keep as-is. -->
<style>
.dk-ghl-footer {
  --ink:          #1A1A1A;
  --ink-soft:     #2A2A2A;
  --white:        #FFFFFF;
  --paper:        #F5F3EE;
  --khaki:        #C5AA88;
  --khaki-light:  #ECE3D7;
  --grey-soft:    #EAEAEA;
  --black:        #000000;
  --red:          #CC0000;
  --red-dark:     #A30000;

  --font-sans:  'DK Helvetica', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-serif: 'DK Century', 'Century Schoolbook', Century, Georgia, 'Times New Roman', serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;

  --max-w: 1280px;
  --edge:  clamp(20px, 5vw, 56px);

  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

  --rule-hair-white: 1px solid rgba(255,255,255,0.12);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);

  color: var(--ink);
  background: var(--white);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.dk-ghl-footer *,
.dk-ghl-footer *::before,
.dk-ghl-footer *::after { box-sizing: border-box; margin: 0; padding: 0; }
.dk-ghl-footer a { text-decoration: none; color: inherit; }
.dk-ghl-footer ul,
.dk-ghl-footer ol { list-style: none; }
.dk-ghl-footer img { display: block; max-width: 100%; }

/* ═══════════════════════════════════════════════════════════════════════
   FOOTER — AI Strategic Diagnostic system
   ═══════════════════════════════════════════════════════════════════════ */
.dk-ghl-footer .dk-foot { background:var(--ink); color:var(--white); padding:var(--s7) 0 var(--s5); }
.dk-ghl-footer .dk-foot .dk-shell { width:100%; max-width:var(--max-w); margin:0 auto; padding-left:var(--edge); padding-right:var(--edge); }
.dk-ghl-footer .dk-foot-grid { display:grid; grid-template-columns:2fr 1fr 1fr 1.5fr; gap:var(--s7); padding-bottom:var(--s6); border-bottom:var(--rule-hair-white); }
.dk-ghl-footer .dk-foot-logo-link { display:inline-block; color:inherit; text-decoration:none; }
.dk-ghl-footer .dk-foot-logo-link:focus-visible { outline:1px solid var(--khaki); outline-offset:4px; }
.dk-ghl-footer .dk-foot-logo-img { display:block; width:auto; height:64px; max-height:64px; object-fit:contain; filter:invert(1); margin-bottom:var(--s4); }
.dk-ghl-footer .dk-foot-tag { font-family:var(--font-serif); font-size:13px; line-height:1.6; color:rgba(255,255,255,0.55); margin-bottom:var(--s4); max-width:260px; }
.dk-ghl-footer .dk-foot-social { display:flex; gap:var(--s4); }
.dk-ghl-footer .dk-foot-social a { font-family:var(--font-sans); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.55); transition:color 180ms var(--ease); }
.dk-ghl-footer .dk-foot-social a:hover,
.dk-ghl-footer .dk-foot-social a:focus-visible { color:var(--white); }
.dk-ghl-footer .dk-foot-col h5,
.dk-ghl-footer .dk-foot-contact h5 { font-family:var(--font-sans); font-size:11px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--khaki); margin-bottom:var(--s4); }
.dk-ghl-footer .dk-foot-col ul { display:flex; flex-direction:column; gap:var(--s2); }
.dk-ghl-footer .dk-foot-col a { font-family:var(--font-sans); font-size:13px; color:rgba(255,255,255,0.65); transition:color 180ms var(--ease); }
.dk-ghl-footer .dk-foot-col a:hover,
.dk-ghl-footer .dk-foot-col a:focus-visible { color:var(--white); }
.dk-ghl-footer .dk-foot-email { display:block; font-family:var(--font-mono); font-size:12px; color:rgba(255,255,255,0.65); margin-bottom:var(--s4); transition:color 180ms var(--ease); }
.dk-ghl-footer .dk-foot-email:hover,
.dk-ghl-footer .dk-foot-email:focus-visible { color:var(--white); }
.dk-ghl-footer .dk-foot-legal { display:flex; justify-content:space-between; align-items:center; padding-top:var(--s4); font-family:var(--font-sans); font-size:11px; color:rgba(255,255,255,0.35); letter-spacing:0.04em; }
.dk-ghl-footer .dk-foot .btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:var(--s2);
  min-height:44px;
  padding:15px 24px;
  font-family:var(--font-sans);
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  letter-spacing:0.14em;
  text-transform:uppercase;
  border-radius:2px;
  box-shadow:none;
  white-space:nowrap;
  cursor:pointer;
  transition:background 180ms var(--ease), color 180ms var(--ease), border-color 180ms var(--ease);
}
.dk-ghl-footer .dk-foot .btn-primary { background:var(--red); color:var(--white) !important; border:0; }
.dk-ghl-footer .dk-foot .btn-primary:hover,
.dk-ghl-footer .dk-foot .btn-primary:focus-visible { background:var(--red-dark); color:var(--white) !important; }
.dk-ghl-footer .dk-foot .btn-primary .arrow { display:inline-block; font-size:13px; line-height:1; letter-spacing:0; transform:translateX(0); transition:transform 200ms var(--ease); }
.dk-ghl-footer .dk-foot .btn-primary:hover .arrow,
.dk-ghl-footer .dk-foot .btn-primary:focus-visible .arrow { transform:translateX(3px); }

@media (max-width: 900px) {
  .dk-ghl-footer .dk-foot-grid { grid-template-columns:1fr 1fr; gap:var(--s5); }
}
@media (max-width: 600px) {
  .dk-ghl-footer .dk-foot-grid { grid-template-columns:1fr; gap:var(--s5); }
  .dk-ghl-footer .dk-foot-legal { flex-direction:column; gap:var(--s2); text-align:center; }
}

/* Dynamic footer mount safety */
.dk-ghl-footer[data-dk-ghl-footer]:empty { display: none; }
.dk-ghl-footer .dk-foot-social:empty { display: none; }
.dk-ghl-footer .dk-foot-col[hidden],
.dk-ghl-footer .dk-foot-contact[hidden] { display: none !important; }


/* ── MOBILE OVERFLOW FIX ──────────────────────────────────────────────
   Prevents the footer from causing horizontal scroll on mobile.
─────────────────────────────────────────────────────────────────────── */
.dk-ghl-footer {
  overflow-x: hidden;
  max-width: 100vw;
}
.dk-ghl-footer .dk-shell {
  max-width: min(var(--max-w), 100%);
  overflow: hidden;
}
.dk-ghl-footer .dk-foot-grid > * {
  min-width: 0;
}
@media (max-width: 600px) {
  .dk-ghl-footer .dk-foot-tag {
    max-width: 100%;
  }
  .dk-ghl-footer .dk-foot-email {
    word-break: break-all;
    overflow-wrap: break-word;
  }
}

  /* ── GHL BUILDER FIX ── */
  .dk-ghl-builder .dk-ghl-footer {
    max-width: 100% !important;
  }
</style>

<div class="dk-ghl-footer" data-dk-ghl-footer></div>

<script>
(function() {
  'use strict';

  var DEFAULT_CONFIG = {
  "brand": {
    "href": "https://danooshkapadia.com/",
    "ariaLabel": "DK Consulting — Home",
    "logo": {
      "src": "https://assets.cdn.filesafe.space/kxDer9IVVD1dNmfX54TI/media/698de9e7c086650bbfe1cf72.png",
      "alt": "DK Consulting"
    }
  },
  "tagline": "Strategic translation for the AI era. Orientation for leaders who don't have time to guess.",
  "social": [
    {
      "label": "LinkedIn",
      "href": "https://www.linkedin.com/in/danooshk/",
      "target": "_blank",
      "rel": "noopener noreferrer"
    },
    {
      "label": "Email",
      "href": "mailto:hello@danooshkapadia.com"
    }
  ],
  "columns": [
    {
      "title": "Navigation",
      "links": [
        {
          "label": "Home",
          "href": "https://danooshkapadia.com/"
        },
        {
          "label": "AI Strategic Diagnostic",
          "href": "https://danooshkapadia.com/diagnostic"
        },
        {
          "label": "Ways to Work Together",
          "href": "https://danooshkapadia.com/ways-to-work-together"
        },
        {
          "label": "AI Team Sprint",
          "href": "https://danooshkapadia.com/team-sprint"
        },
        {
          "label": "About",
          "href": "https://danooshkapadia.com/about"
        },
        {
          "label": "Contact",
          "href": "https://danooshkapadia.com/contact"
        }
      ]
    },
    {
      "title": "Resources",
      "links": [
        {
          "label": "Resources",
          "href": "https://danooshkapadia.com/resources"
        },
        {
          "label": "Blog",
          "href": "https://danooshkapadia.com/blog"
        }
      ]
    }
  ],
  "contact": {
    "title": "Contact",
    "email": "hello@danooshkapadia.com"
  },
  "legal": {
    "copyrightTemplate": "© {{year}} DK Consulting. All rights reserved.",
    "year": "auto",
    "edition": "Edition 01 · v5.0"
  },
  "behavior": {
    "hideEmptyColumns": true,
    "openExternalInNewTab": false
  }
};

  var activeConfig = mergeDeep(clone(DEFAULT_CONFIG), window.DKGhlFooterConfig || {});

  function clone(value) {
    return JSON.parse(JSON.stringify(value || {}));
  }

  function isPlainObject(value) {
    return Object.prototype.toString.call(value) === '[object Object]';
  }

  function mergeDeep(target, source) {
    var output = isPlainObject(target) ? target : {};
    if (!isPlainObject(source)) return output;

    Object.keys(source).forEach(function(key) {
      var value = source[key];
      if (Array.isArray(value)) {
        output[key] = value.slice();
      } else if (isPlainObject(value)) {
        output[key] = mergeDeep(isPlainObject(output[key]) ? output[key] : {}, value);
      } else {
        output[key] = value;
      }
    });

    return output;
  }

  function createEl(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (typeof text === 'string') node.textContent = text;
    return node;
  }

  function setAttrs(node, attrs) {
    Object.keys(attrs || {}).forEach(function(name) {
      var value = attrs[name];
      if (value === null || value === undefined || value === false || value === '') return;
      node.setAttribute(name, String(value));
    });
    return node;
  }

  function isExternalUrl(href) {
    if (!href || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0 || href.charAt(0) === '#') return false;
    try { return new URL(href, window.location.href).origin !== window.location.origin; }
    catch (e) { return false; }
  }

  function createLink(link, className) {
    var a = createEl('a', className || '', link && link.label ? link.label : '');
    var href = link && link.href ? link.href : '#';
    a.href = href;

    if (link && link.target) a.target = link.target;
    if (link && link.rel) a.rel = link.rel;

    if (activeConfig.behavior && activeConfig.behavior.openExternalInNewTab && isExternalUrl(href) && !a.target) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }

    if (link && link.ariaLabel) a.setAttribute('aria-label', link.ariaLabel);
    return a;
  }

  function tokenReplace(value, config) {
    var year = config.legal && config.legal.year;
    if (!year || year === 'auto') year = new Date().getFullYear();
    return String(value || '').replace(/{{\s*year\s*}}/g, String(year));
  }

  function readInlineConfig(root) {
    var script = root.querySelector('script[type="application/json"][data-dk-ghl-footer-config]');
    if (!script) return {};
    try { return JSON.parse(script.textContent || '{}'); }
    catch (e) { return {}; }
  }

  function renderFooter(root, config) {
    if (!root) return;

    var inlineConfig = readInlineConfig(root);
    var localConfig = mergeDeep(clone(config), inlineConfig);

    root.innerHTML = '';
    root.setAttribute('data-dk-ghl-footer-rendered', 'true');

    var footer = createEl('footer', 'dk-foot');
    var shell = createEl('div', 'dk-shell');
    var grid = createEl('div', 'dk-foot-grid');

    /* Brand column */
    var brandCol = createEl('div');
    var brand = localConfig.brand || {};
    var brandLink = createEl('a', 'dk-foot-logo-link');
    brandLink.href = brand.href || '#';
    setAttrs(brandLink, { 'aria-label': brand.ariaLabel || 'Home' });

    var logo = brand.logo || {};
    if (logo.src) {
      var logoImg = createEl('img', 'dk-foot-logo-img');
      logoImg.src = logo.src;
      logoImg.alt = logo.alt || '';
      brandLink.appendChild(logoImg);
    }
    brandCol.appendChild(brandLink);

    if (localConfig.tagline) {
      brandCol.appendChild(createEl('div', 'dk-foot-tag', localConfig.tagline));
    }

    var socialWrap = createEl('div', 'dk-foot-social');
    (localConfig.social || []).forEach(function(item) {
      if (!item || !item.label) return;
      socialWrap.appendChild(createLink(item));
    });
    brandCol.appendChild(socialWrap);
    grid.appendChild(brandCol);

    /* Link columns */
    (localConfig.columns || []).forEach(function(column) {
      var links = column && Array.isArray(column.links) ? column.links.filter(function(link) { return link && link.label; }) : [];
      if (localConfig.behavior && localConfig.behavior.hideEmptyColumns && !links.length) return;

      var col = createEl('div', 'dk-foot-col');
      if (column && column.title) col.appendChild(createEl('h5', '', column.title));
      var list = createEl('ul');

      links.forEach(function(link) {
        var item = createEl('li');
        item.appendChild(createLink(link));
        list.appendChild(item);
      });

      col.appendChild(list);
      grid.appendChild(col);
    });

    /* Contact column */
    var contact = localConfig.contact || {};
    var hasContact = contact.title || contact.email || (contact.cta && contact.cta.label);
    if (hasContact) {
      var contactCol = createEl('div', 'dk-foot-contact');
      if (contact.title) contactCol.appendChild(createEl('h5', '', contact.title));

      if (contact.email) {
        var email = createEl('a', 'dk-foot-email', contact.email);
        email.href = contact.email.indexOf('mailto:') === 0 ? contact.email : 'mailto:' + contact.email;
        contactCol.appendChild(email);
      }

      if (contact.cta && contact.cta.label) {
        var cta = createLink(contact.cta, 'btn btn-primary');
        cta.textContent = contact.cta.label + ' ';
        if (contact.cta.arrow !== false) {
          var arrow = createEl('span', 'arrow', contact.cta.arrow || '→');
          arrow.setAttribute('aria-hidden', 'true');
          cta.appendChild(arrow);
        }
        contactCol.appendChild(cta);
      }

      grid.appendChild(contactCol);
    }

    shell.appendChild(grid);

    /* Legal row */
    var legal = localConfig.legal || {};
    if (legal.copyrightTemplate || legal.copyright || legal.edition) {
      var legalRow = createEl('div', 'dk-foot-legal');
      legalRow.appendChild(createEl('div', '', tokenReplace(legal.copyright || legal.copyrightTemplate || '', localConfig)));
      legalRow.appendChild(createEl('div', '', legal.edition || ''));
      shell.appendChild(legalRow);
    }

    footer.appendChild(shell);
    root.appendChild(footer);
  }

  function initAll() {
    var roots = document.querySelectorAll('[data-dk-ghl-footer]');
    Array.prototype.forEach.call(roots, function(root) {
      renderFooter(root, activeConfig);
    });
  }

  window.DKGhlFooter = window.DKGhlFooter || {};
  window.DKGhlFooter.getConfig = function() { return clone(activeConfig); };
  window.DKGhlFooter.render = initAll;
  window.DKGhlFooter.update = function(nextConfig) {
    activeConfig = mergeDeep(clone(activeConfig), nextConfig || {});
    initAll();
    return clone(activeConfig);
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAll);
  } else {
    initAll();
  }

  window.addEventListener('load', initAll);
})();
</script>
